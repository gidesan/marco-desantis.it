<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Marco Ignazio de Santis">
  <g transform="translate(50 50) scale(1.2) translate(-50 -50) rotate(-38 50 50) translate(29 2)" fill="#b25334">
    <!-- feather vane: asymmetric, wider on the outer (right) edge -->
    <path d="M 20,4
             C 32,12 40,26 38,44
             C 37,56 31,66 23,74
             L 19,84
             L 16,74
             C 10,66 6,56 7,44
             C 8,28 13,14 20,4
             Z" />
    <!-- bare shaft tapering to a fine nib point -->
    <path d="M 19,82 L 21,92 L 17.4,100 L 14,92 L 17,82 Z" />
  </g>
  <g transform="translate(50 50) scale(1.2) translate(-50 -50) rotate(-38 50 50) translate(29 2)" stroke="#7c3a22" stroke-linecap="round" fill="none">
    <!-- rachis (center rib), continues into the nib's ink slit -->
    <line x1="20" y1="7" x2="17.4" y2="97" stroke-width="1.4" />
    <!-- barbs: shorter/straighter on the left, longer sweeping curves on the right -->
    <path d="M 19.6,18 Q 12,21 9,27" stroke-width="1.3" />
    <path d="M 19.6,18 Q 30,22 34,29" stroke-width="1.3" />
    <path d="M 19.2,32 Q 11,36 8,43" stroke-width="1.3" />
    <path d="M 19.2,32 Q 31,37 35,45" stroke-width="1.3" />
    <path d="M 18.8,46 Q 12,50 10,56" stroke-width="1.3" />
    <path d="M 18.8,46 Q 29,51 32,58" stroke-width="1.3" />
    <path d="M 18.4,60 Q 14,63 12.5,68" stroke-width="1.2" />
    <path d="M 18.4,60 Q 25,64 27,69" stroke-width="1.2" />
  </g>
</svg>
